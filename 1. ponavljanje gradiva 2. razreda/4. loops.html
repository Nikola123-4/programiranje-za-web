<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Zadatak 1: Ispisati prvih 10 prirodnih brojeva u konzoli
        console.log("1")
        console.log("2")
        console.log("3")
        console.log("4")
        console.log("5")
        console.log("6")
        console.log("7")
        console.log("8")
        console.log("9")
        console.log("10")
        //Zadatak 1 - riješenje pomoću for petlje
        for (let index = 1; index < 5; index++) {
            console.log(index)
        }

        // Zadatak 2: Ispisati prvih 5 parnih brojeva u onzoli
        // pomoću for petlje

        for (let index = 2; index <= 10; index+=2) {
            console.log(index);
        }


        // Zadatak: ISpisati prvih 10 brojeva u konzoli unatrag
        
        for (let index = 10; index >= 0; index++) {
            console.log(index)
        }

    </script>
</body>
</html>
